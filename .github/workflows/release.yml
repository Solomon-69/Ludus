name: Release

# Push a tag like v1.5 to build both apps and attach Ludus-mac.zip and Ludus-windows.zip
# to a GitHub Release with that name. The download page (docs/index.html) links to
# releases/latest/download/<file>, so it always serves the newest release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  mac:
    name: Mac app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Build Ludus.app
        env:
          # Ad-hoc signature: CI has no Apple certificate. With a Developer ID you would import it
          # into a keychain here, set SIGN_ID to it, then notarize (see README, "Signing").
          SIGN_ID: '-'
          LUDUS_OUT: ${{ runner.temp }}/ludus-build
        run: RELEASE=1 ./build.sh --no-install

      - name: Zip
        run: ditto -c -k --keepParent "$RUNNER_TEMP/ludus-build/Ludus.app" Ludus-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Ludus-mac
          path: Ludus-mac.zip

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Ludus.exe
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          dotnet publish windows/Ludus.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:Version=$version -o out/Ludus

      - name: Check the game files came along
        shell: pwsh
        run: |
          if (-not (Test-Path out/Ludus/Ludus.exe)) { throw "Ludus.exe missing" }
          if (-not (Test-Path out/Ludus/web/index.html)) { throw "web/index.html missing" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out/Ludus -DestinationPath Ludus-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Ludus-windows
          path: Ludus-windows.zip

  release:
    name: GitHub Release
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Ludus-*
          path: dist
          merge-multiple: true

      - name: Create the release (or refresh its files on a re-run)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/Ludus-mac.zip dist/Ludus-windows.zip --clobber
          else
            gh release create "$tag" dist/Ludus-mac.zip dist/Ludus-windows.zip \
              --title "Ludus ${tag#v}" --generate-notes
          fi
