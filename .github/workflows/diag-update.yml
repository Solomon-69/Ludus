name: Diag update (temporary)
on:
  push:
    branches: [misc-fix-2]
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 1.12.15 updates in-app to 1.12.16
        shell: powershell
        run: ./windows/ci/update-real.ps1 -From '1.12.15' -To '1.12.16' -Out update-test -Limit 240
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: diag-update, path: update-test }
  climb:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet publish windows/Ludus.csproj -c Release -o out/Ludus
        shell: pwsh
      - name: Hammer Climb probe
        shell: powershell
        run: ./windows/ci/climb-probe.ps1 -Exe out/Ludus/Ludus.exe -Out probe
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: diag-climb, path: probe }
