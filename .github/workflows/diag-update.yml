name: Diag update (temporary)
on:
  push:
    branches: [misc-fix-2]
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 1.12.15 updates in-app to 1.12.16
        shell: pwsh
        run: ./windows/ci/update-real.ps1 -From '1.12.15' -To '1.12.16' -Out update-test -Limit 240
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: diag-update, path: update-test }
