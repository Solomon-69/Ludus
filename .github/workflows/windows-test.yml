name: Windows test

# Builds the Windows app, runs it on a real Windows machine, checks it works and keeps screenshots.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (self-contained, single file)
        shell: pwsh
        run: dotnet publish windows/Ludus.csproj -c Release -o out/Ludus

      - name: Make sure WebView2 is installed
        shell: pwsh
        run: |
          $keys = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if ($keys | Where-Object { Test-Path $_ }) { Write-Host 'WebView2 runtime present'; exit 0 }
          Write-Host 'Installing WebView2 runtime'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile wv2.exe
          Start-Process .\wv2.exe -ArgumentList '/silent','/install' -Wait

      - name: Run and check
        shell: pwsh
        run: ./windows/ci/test.ps1 -Exe out/Ludus/Ludus.exe -Shots shots

      - name: Friend-reported features (Hammer Climb starts, Original names)
        shell: powershell
        run: ./windows/ci/features.ps1 -Exe out/Ludus/Ludus.exe -Out shots/features

      - name: Update self-test against the real newest release (check, download, verify, unzip)
        shell: pwsh
        run: |
          $res = Join-Path (Resolve-Path shots) 'update-selftest.json'
          Start-Process out/Ludus/Ludus.exe -ArgumentList "--selftest-update=$res" -Wait
          Get-Content $res
          $r = Get-Content $res -Raw | ConvertFrom-Json
          if (-not $r.ok -or $r.maxPct -le 0 -or $r.seconds -gt 120) { throw "update self-test failed: $($r.error)" }

      - name: In-app update end to end (this build, numbered 1.0.0, updates itself to the newest release)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet publish windows/Ludus.csproj -c Release -p:Version=1.0.0 -o out/old
          $to = (gh release view --repo $env:GITHUB_REPOSITORY --json tagName -q .tagName).TrimStart('v')
          ./windows/ci/update-real.ps1 -FromDir out/old -To $to -Out shots/update -Limit 240

      - name: Keep the app logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          Copy-Item "$env:APPDATA\Ludus\*.log" shots -ErrorAction SilentlyContinue
          Copy-Item "$env:APPDATA\Ludus\*.json" shots -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ludus-screenshots
          path: shots
          retention-days: 14

      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path out/Ludus/* -DestinationPath Ludus-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Ludus-windows
          path: Ludus-windows.zip
          retention-days: 14
