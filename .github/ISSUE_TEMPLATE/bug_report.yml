name: Bug report
description: Something in Ludus isn't working the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A few details help a lot.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
      placeholder: I closed the panel during Snake and when I opened it again the game had restarted.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Ludus from the menu bar
        2. Start Snake
        3. Click outside the panel, then open it again
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Which game or screen?
      placeholder: Snake, Settings, the games list...
  - type: dropdown
    id: platform
    attributes:
      label: Mac or Windows?
      options:
        - Mac
        - Windows
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: System version
      description: "Mac: Apple menu > About This Mac. Windows: Settings > System > About."
      placeholder: macOS 26.1, or Windows 11 24H2
    validations:
      required: true
  - type: input
    id: ludus-version
    attributes:
      label: Ludus version
      description: The release you downloaded, for example 1.5.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Drag images here if they help show the problem.
