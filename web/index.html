<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludus</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script>/* startup watch: a script error before the page is ready is reported to the app shell, which shows a fallback screen if the page never comes up */
(function(){window.addEventListener('error',function(e){if(window.__ludusReady)return;var m={type:'uifail',line:String(e.message||'error')+' '+String(e.filename||'')+':'+(e.lineno||0)};
try{window.webkit.messageHandlers.ludus.postMessage(m)}catch(a){try{window.chrome.webview.postMessage(m)}catch(b){}}});})();</script>
</head>
<body>
<div id="app" class="app">
  <!-- Home -->
  <section id="home" class="view view-home is-active" aria-label="Games">
    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 88 55" aria-hidden="true"><use href="#ludus-mark"/></svg>
        <div>
          <div class="brand-name">Ludus</div>
          <div class="brand-sub" id="brandSub">Take a little break</div>
        </div>
      </div>
      <button class="icon-btn" id="openSettings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><use href="#i-gear"/></svg>
      </button>
    </header>
    <label class="search" id="searchBox">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Search games" autocomplete="off" spellcheck="false" aria-label="Search games">
      <kbd>/</kbd>
    </label>
    <div class="filters" id="filters" role="tablist"></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- Game -->
  <section id="game" class="view view-game" aria-label="Game">
    <header class="topbar game-bar">
      <button class="icon-btn" id="backBtn" aria-label="Back to games">
        <svg viewBox="0 0 24 24"><use href="#i-back"/></svg>
      </button>
      <div class="game-title">
        <div class="game-name" id="gameName"></div>
        <div class="scores" id="gameScores">
          <span>Score <b id="scoreNow">0</b></span>
          <span>Best <b id="scoreBest">0</b></span>
        </div>
        <div class="vs-toggle" id="vsToggle" role="group" aria-label="Opponent" hidden>
          <button type="button" data-vs="bot">vs Bot</button>
          <button type="button" data-vs="friend">vs Friend</button>
          <button type="button" data-vs="online" hidden>Online</button>
        </div>
        <div class="online-chip" id="onlineChip" role="status" hidden>
          <i class="dot" aria-hidden="true"></i><span id="onlineState">Online</span><b id="onlineCode"></b>
        </div>
      </div>
      <div class="bar-right">
        <button class="icon-btn" id="orientBtn" aria-label="Switch between wide and tall" title="Wide or tall" hidden>
          <svg viewBox="0 0 24 24"><use id="orientUse" href="#i-rotate"/></svg>
        </button>
        <button class="btn leave-btn" id="leaveBtn" hidden>Leave</button>
        <button class="icon-btn" id="gameSettings" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24"><use href="#i-gear"/></svg>
        </button>
        <button class="icon-btn" id="pauseBtn" aria-label="Pause">
          <svg viewBox="0 0 24 24"><use href="#i-pause"/></svg>
        </button>
      </div>
    </header>
    <div class="stage-wrap">
      <div class="stage" id="stage"></div>
      <div class="sheet" id="pauseSheet" hidden>
        <div class="sheet-card">
          <div class="sheet-title" id="pauseTitle">Paused</div>
          <button class="btn primary" id="resumeBtn">Resume</button>
          <button class="btn" id="restartBtn">Restart</button>
          <button class="btn ghost" id="quitBtn">All games</button>
        </div>
      </div>
      <div class="sheet crash-sheet" id="crashSheet" role="alertdialog" aria-labelledby="crashTitle" hidden>
        <div class="sheet-card crash-card">
          <div class="crash-art"><canvas id="crashArt"></canvas></div>
          <div class="sheet-title" id="crashTitle">Something went wrong</div>
          <p class="crash-line" id="crashLine">This game stopped unexpectedly. Your last save is safe.</p>
          <button class="btn primary" id="crashRetry">Try again</button>
          <button class="btn" id="crashNew">New game</button>
          <button class="btn ghost" id="crashBack">Back to games</button>
        </div>
      </div>
      <div class="sheet lobby" id="lobbySheet" role="dialog" aria-modal="true" aria-label="Play online" hidden>
        <div class="lobby-card" id="lobbyCard"></div>
      </div>
      <button class="over-peek" id="overPeek" hidden>Show result</button>
    </div>
    <div class="over-bar" id="overSheet" hidden>
        <div class="over-info">
          <div class="over-title" id="overTitle">Game over</div>
          <div class="over-line"><b id="overScore">0</b><small id="overBest"></small></div>
        </div>
        <div class="over-actions">
          <button class="btn primary" id="againBtn">Play again</button>
          <button class="btn ghost" id="overQuitBtn">All games</button>
          <button class="btn ghost see-board" id="overHideBtn" aria-label="Hide this bar to see the board"><svg viewBox="0 0 24 24"><use href="#i-down"/></svg>See board</button>
        </div>
      </div>
    <footer class="hint" id="hint"></footer>
  </section>

  <!-- Settings -->
  <section id="settings" class="view view-settings" aria-label="Settings">
    <header class="topbar">
      <button class="icon-btn" id="settingsBack" aria-label="Back">
        <svg viewBox="0 0 24 24"><use href="#i-back"/></svg>
      </button>
      <div class="brand-name">Settings</div>
      <span style="width:32px;flex:none" aria-hidden="true"></span>
    </header>
    <div class="settings-body" id="settingsBody"></div>
  </section>
</div>

  <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></g></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></symbol>

  <symbol id="i-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M7 5h3.2v14H7zM13.8 5H17v14h-3.2z"/></symbol>
</svg>
